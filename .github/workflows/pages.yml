name: results page

on:
  push:
    branches: [main]
    paths: ["site/**", "results/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "results/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      # Rebuilds every number on the page from results/ and fails if any of them does not
      # match its source.
      - run: site/build.sh
      # Opens the page in a browser and fails if any chart label overlaps another or runs off
      # the chart.
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python site/check_layout.py
      - run: mkdir -p _site && cp site/build/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
